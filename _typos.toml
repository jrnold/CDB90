# Lint baseline: typos. Add project words under [default.extend-words] with a comment.
[files]
extend-exclude = [
  "*.bib",
  "*.html",
  "*.lock",
  "_freeze/",
  "_site/",
  "data/",
  "src-data/",  # source data, kept verbatim
  "data-raw/",
]

[default]
extend-ignore-re = [
  # Hex strings and hashes
  "\\b[0-9a-f]{7,40}\\b",
  # A line ending in a `spellchecker:disable-line` comment
  "(?Rm)^.*(#|//|--)\\s*spellchecker:disable-line$",
]

[default.extend-words]
# Variable name prefix in the CDB90 data (e.g. nam1, nam2)
nam = "nam"
# CDB90 column name
NAMD = "NAMD"
