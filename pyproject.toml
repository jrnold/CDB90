[project]
name = "cdb90"
version = "10.8.0"
description = "A tidier and open-data version of CDB90 (CAA Database of Battles, Version 1990)"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "duckdb>=1.5.6",
    "llama-cloud>=2.19.0",
    "pandas>=2.3.3",
    "pyyaml",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "daff>=1.4.2",
    "deptry>=0.25.1",
    "dvc>=3.67.1",
    "frictionless>=5.21.0",
    "pandas-stubs>=2.3.3.260113",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "ty>=0.0.91",
]

[tool.ruff]
line-length = 100
# Vendored from okfn/dptools (bin/load-sqlite.py); kept as upstream wrote it.
extend-exclude = ["load-sqlite.py"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "RUF", "SIM", "C4", "PT", "NPY", "PD", "PTH", "RET", "ARG",
    "PL", "TRY", "PERF", "FURB", "S", "DTZ", "N",
]
ignore = [
    "N803",     # argument names like X, N, K, Sigma are standard notation
    "N806",     # so are variable names
    "PLR0913",  # estimators take many arguments
    "PLR2004",  # 0.05, 1.96 and friends are fine as literals
    "S311",     # `random` drives simulations, not cryptography
    "TRY003",   # long exception messages are fine
    "PD011",    # misfires on xarray and NumPy `.values`
    "RUF001",   # prose and labels use γ, ×, – on purpose
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S608", "ARG"]  # S608: tests build DuckDB queries from fixed paths
"*.ipynb" = ["B018", "E402"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
testpaths = ["tests"]
pythonpath = ["."]  # so the tests can import create_data.py
