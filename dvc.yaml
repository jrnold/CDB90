# CDB90 build. All outputs are small and published from git, so every output is `cache: false`
# (exception to baseline rule L1, see AGENTS.md); there is no DVC remote.
# Run the whole build with `uv run dvc repro`. The `links` and `coordinates` stages query the
# Wikipedia and Wikidata APIs, so they need network access.
#
# Outputs: relational tables (data/relational/, loaded into SQLite), flat analysis tables
# (data/flat/, CSV and Parquet) and the Data Package for the flat CSVs (datapackage.json).
stages:
  # Stages depend on the runtime packages only, so adding a dev tool doesn't make them stale.
  runtime-lock:
    cmd: uv export --no-dev --frozen --no-header --no-emit-project -o requirements.lock
    deps:
      - uv.lock
    outs:
      - requirements.lock:
          cache: false

  # The relational tables, and the original and patched CDB90 data.
  build-tables:
    cmd: uv run --frozen python create_data.py
    deps:
      - create_data.py
      - requirements.lock
      - src-data/M000121
      - src-data/CDB90/patch.yaml
      - src-data/CDB90/cols.json
      - src-data/local/belligerents.csv
      - src-data/local/commanders.csv
      - src-data/local/duplicates.csv
      - src-data/local/wars.csv
      - src-data/variable_levels.json
      - src-data/version.txt
    outs:
      - data/relational/active_periods.csv:
          cache: false
      - data/relational/battle_actors.csv:
          cache: false
      - data/relational/battle_durations.csv:
          cache: false
      - data/relational/battle_dyads.csv:
          cache: false
      - data/relational/battles.csv:
          cache: false
      - data/relational/belligerents.csv:
          cache: false
      - data/relational/commanders.csv:
          cache: false
      - data/relational/enum_aeroa.csv:
          cache: false
      - data/relational/enum_cea.csv:
          cache: false
      - data/relational/enum_codead.csv:
          cache: false
      - data/relational/enum_crit.csv:
          cache: false
      - data/relational/enum_post.csv:
          cache: false
      - data/relational/enum_postype.csv:
          cache: false
      - data/relational/enum_pri.csv:
          cache: false
      - data/relational/enum_reso.csv:
          cache: false
      - data/relational/enum_surpa.csv:
          cache: false
      - data/relational/enum_terra1.csv:
          cache: false
      - data/relational/enum_terra2.csv:
          cache: false
      - data/relational/enum_terra3.csv:
          cache: false
      - data/relational/enum_wina.csv:
          cache: false
      - data/relational/enum_wx1.csv:
          cache: false
      - data/relational/enum_wx2.csv:
          cache: false
      - data/relational/enum_wx3.csv:
          cache: false
      - data/relational/enum_wx4.csv:
          cache: false
      - data/relational/enum_wx5.csv:
          cache: false
      - data/relational/front_widths.csv:
          cache: false
      - data/relational/terrain.csv:
          cache: false
      - data/relational/version.csv:
          cache: false
      - data/relational/weather.csv:
          cache: false
      - src-data/CDB90/CDB90-orig.csv:
          cache: false
      - src-data/CDB90/CDB90-patched.csv:
          cache: false

  # Resolve the curated links to Wikidata items (Wikipedia API).
  links:
    cmd: uv run --frozen python -m scripts.links
    deps:
      - scripts/links.py
      - requirements.lock
      - src-data/local/battle_links.csv
    outs:
      - data/relational/battle_links.csv:
          cache: false

  # Coordinates from Wikidata (SPARQL API).
  coordinates:
    cmd: uv run --frozen python -m scripts.coordinates
    deps:
      - scripts/coordinates.py
      - requirements.lock
      - data/relational/battle_links.csv
      - src-data/local/coordinates_places.csv
    outs:
      - data/relational/battle_coordinates.csv:
          cache: false

  # The HERO narratives (OCR text of CAA-SR-84-6): narrative, significance and sources by battle.
  narratives:
    cmd: uv run --frozen python -m scripts.narratives
    deps:
      - scripts/narratives.py
      - requirements.lock
      - src-data/docs/hero
      - src-data/docs/hero-1988
      - src-data/local/narrative_matches.csv
      - data/relational/battles.csv
      - data/relational/battle_durations.csv
    outs:
      - data/relational/battle_narratives.csv:
          cache: false

  # Flat analysis tables, as CSV and Parquet.
  flat:
    cmd: uv run --frozen python -m scripts.flat
    deps:
      - scripts/flat.py
      - requirements.lock
      - data/relational/battles.csv
      - data/relational/belligerents.csv
      - data/relational/battle_durations.csv
      - data/relational/front_widths.csv
      - data/relational/commanders.csv
      - data/relational/battle_coordinates.csv
      - data/relational/battle_links.csv
      - data/relational/battle_narratives.csv
    outs:
      - data/flat/battles.csv:
          cache: false
      - data/flat/battles.parquet:
          cache: false
      - data/flat/sides.csv:
          cache: false
      - data/flat/sides.parquet:
          cache: false
      - data/flat/narratives.csv:
          cache: false
      - data/flat/narratives.parquet:
          cache: false

  # Data Package (Frictionless) for the flat CSV tables.
  datapackage:
    cmd: uv run --frozen python make_datapackage.py
    deps:
      - make_datapackage.py
      - requirements.lock
      - src-data/datapackage/datapackage.yaml
      - src-data/datapackage/flat.yaml
      - src-data/datapackage/resources
      - src-data/version.txt
      - data/flat/battles.parquet
      - data/flat/sides.parquet
      - data/flat/narratives.parquet
    outs:
      - datapackage.json:
          cache: false

  # SQLite database of the relational tables.
  sqlite:
    cmd: uv run --frozen python -m scripts.sqlite
    deps:
      - scripts/sqlite.py
      - requirements.lock
      - src-data/datapackage
      - data/relational/active_periods.csv
      - data/relational/battle_actors.csv
      - data/relational/battle_coordinates.csv
      - data/relational/battle_durations.csv
      - data/relational/battle_dyads.csv
      - data/relational/battle_links.csv
      - data/relational/battle_narratives.csv
      - data/relational/battles.csv
      - data/relational/belligerents.csv
      - data/relational/commanders.csv
      - data/relational/enum_aeroa.csv
      - data/relational/enum_cea.csv
      - data/relational/enum_codead.csv
      - data/relational/enum_crit.csv
      - data/relational/enum_post.csv
      - data/relational/enum_postype.csv
      - data/relational/enum_pri.csv
      - data/relational/enum_reso.csv
      - data/relational/enum_surpa.csv
      - data/relational/enum_terra1.csv
      - data/relational/enum_terra2.csv
      - data/relational/enum_terra3.csv
      - data/relational/enum_wina.csv
      - data/relational/enum_wx1.csv
      - data/relational/enum_wx2.csv
      - data/relational/enum_wx3.csv
      - data/relational/enum_wx4.csv
      - data/relational/enum_wx5.csv
      - data/relational/front_widths.csv
      - data/relational/terrain.csv
      - data/relational/version.csv
      - data/relational/weather.csv
    outs:
      - cdb90.sqlite3:
          cache: false

  # OCR of the original documentation PDF with LlamaParse. Frozen (a live API call): to rerun,
  # `dvc unfreeze ocr && dvc repro ocr && dvc freeze ocr`, with LLAMA_CLOUD_API_KEY set.
  ocr:
    frozen: true
    cmd: uv run --frozen python -m scripts.ocr
    deps:
      - scripts/ocr.py
      - requirements.lock
      - src-data/docs/AD1038724.pdf
    outs:
      - src-data/docs/AD1038724.md:
          cache: false

  # Codebook of the tables, columns and codes (part of the Zenodo deposit).
  codebook:
    cmd: uv run --frozen python -m scripts.codebook
    deps:
      - scripts/codebook.py
      - requirements.lock
      - datapackage.json
      - src-data/datapackage
      - data/relational
    outs:
      - docs/codebook.md:
          cache: false

  # Diff of the original and patched CDB90 data.
  diff:
    cmd: >-
      uv run --frozen daff diff --output src-data/CDB90/diff.csv --context 0
      src-data/CDB90/CDB90-orig.csv src-data/CDB90/CDB90-patched.csv &&
      uv run --frozen daff render --output src-data/CDB90/diff.html src-data/CDB90/diff.csv
    deps:
      - requirements.lock
      - src-data/CDB90/CDB90-orig.csv
      - src-data/CDB90/CDB90-patched.csv
    outs:
      - src-data/CDB90/diff.csv:
          cache: false
      - src-data/CDB90/diff.html:
          cache: false
