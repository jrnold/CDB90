description: >-
  Links from battles to Wikidata items and English Wikipedia articles. A battle has one or more
  links: the battle itself, or the smallest campaign or war that covers it. Curated in
  `src-data/local/battle_links.csv`; resolved by `scripts/links.py`.
path: data/battle_links.csv
schema:
  fields:
  - id: isqno
    description: Battle sequence number.
    type: integer
  - id: wikidata_id
    description: Wikidata item (Q number).
    type: string
  - id: wikipedia_title
    description: Title of the English Wikipedia article, after redirects.
    type: string
  - id: wikipedia_url
    description: URL of the English Wikipedia article.
    type: string
  - id: match
    description: >-
      How specific the link is: `battle` (an article on this battle), `campaign` (the smallest
      operation or campaign article that covers it) or `war` (only a war or front article exists).
    type: string
