description: >-
  Coordinates of battles, from Wikidata (CC0). Each battle gets the point of its most specific item
  that has coordinates, and `precision` says what kind of item that is, so the point of a campaign
  can be told from that of a battlefield. The points are not checked against the CDB90 location
  text. Built by `scripts/coordinates.py` from `battle_links`, plus place lookups in
  `src-data/local/coordinates_places.csv`.
path: data/relational/battle_coordinates.csv
schema:
  fields:
  - id: isqno
    description: Battle sequence number.
    type: integer
  - id: latitude
    description: Latitude (WGS 84, decimal degrees).
    type: number
  - id: longitude
    description: Longitude (WGS 84, decimal degrees).
    type: number
  - id: wikidata_id
    description: Wikidata item the point comes from.
    type: string
  - id: precision
    description: >-
      What the point is: `battle` (the battle's own item), `place` (the place it is named after),
      `campaign` (an operation or campaign it was part of), `region` (a larger area) or `war`.
    type: string
